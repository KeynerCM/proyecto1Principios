# Configuracion de la minicomputadora
# Se puede editar a mano; los cambios se aplican al reiniciar el programa.

# Memoria principal: posiciones totales. El kernel no se configura: ocupa 128 celdas (3 de cabecera + 5 BCP x 25), y a los programas les deben quedar al menos 32
memoria.tamano=256

# Disco: posiciones totales (minimo 64); las primeras 20 son el indice
disco.tamano=512
# Posiciones al final del disco reservadas para memoria virtual
disco.memoriaVirtual=64

# Milisegundos reales por cada segundo de CPU en la ejecucion automatica (50 a 2000)
ejecucion.msPorSegundo=1000

# Algoritmo de planificacion de procesos. Disponibles: FCFS
planificacion.algoritmo=FCFS
